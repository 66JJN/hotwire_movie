# Render Blueprint: one free Postgres instance + one Docker web service.
# Dashboard → New → Blueprint → pick this repo. Secrets are generated by Render, never committed.
databases:
  - name: hotwire-movie-db
    databaseName: hotwire_movie
    user: hotwire_movie
    plan: free

services:
  - type: web
    name: hotwire-movie
    runtime: docker
    plan: free
    healthCheckPath: /up
    # db:prepare (creates the 4 databases, loads schemas, seeds on first deploy),
    # then Puma directly (skip Thruster, which binds port 80).
    dockerCommand: ./bin/render-start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotwire-movie-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # Runs Solid Queue inside Puma: broadcasts_to / broadcasts_refreshes_to send through jobs.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: PORT
        value: "3000"
      # One Puma process. Unset, Render's WEB_CONCURRENCY starts several forked
      # workers, too much for the free 512 MB instance.
      - key: WEB_CONCURRENCY
        value: "0"
