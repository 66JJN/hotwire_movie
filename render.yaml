# Render Blueprint: one free Postgres instance + one Docker web service.
# Dashboard → New → Blueprint → pick this repo. Secrets are generated by Render, never committed.
databases:
  - name: hotwire-movie-db
    databaseName: hotwire_movie
    user: hotwire_movie
    plan: free

services:
  - type: web
    name: hotwire-movie
    runtime: docker
    plan: free
    healthCheckPath: /up
    # Puma directly (skip Thruster, which binds port 80). The entrypoint still runs
    # db:prepare first: creates the 4 databases, loads schemas, seeds on first deploy.
    dockerCommand: ./bin/rails server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hotwire-movie-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # Runs Solid Queue inside Puma: broadcasts_to / broadcasts_refreshes_to send through jobs.
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: PORT
        value: "3000"
